{const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#0a0f1e');g.addColorStop(.5,'#26324f');g.addColorStop(.52,'#0b0e16');g.addColorStop(1,'#05070b');x.fillStyle=g;x.fillRect(0,0,512,256);

  ghost.addEventListener('click',toggleGhost);
  addEventListener('keydown',e=>{if(e.code==='KeyB'&&!picking){toggleGhost();e.preventDefault()}});
  syncGhost();

  // Touch controls feed the same input state as the keyboard.
  const pad=document.createElement('div');pad.id='touchDrive';
  pad.innerHTML='<div class="cluster"><button data-key="KeyA">◀</button><button data-key="KeyD">▶</button></div><div class="cluster"><button class="pedal" data-key="Space">HANDBRAKE</button><button class="pedal" data-key="KeyS">BRAKE</button><button class="pedal" data-key="KeyW">GAS</button></div>';
  document.body.appendChild(pad);
  pad.querySelectorAll('button[data-key]').forEach(b=>{
    const key=b.dataset.key;
    const down=e=>{e.preventDefault();if(!picking)K[key]=1;try{b.setPointerCapture(e.pointerId)}catch(_){}};
    const up=e=>{e.preventDefault();K[key]=0};
    b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up));
  });
  addEventListener('blur',()=>{for(const k in K)K[k]=0});

  // Gamepad: left stick steers; right trigger accelerates; left trigger brakes.
  window.__padSteer=0;
  const raf=window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame=cb=>raf(t=>{
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    const p=pads&&Array.from(pads).find(Boolean);
    window.__padSteer=0;
    if(p&&!picking){
      const ax=p.axes&&p.axes.length>0?p.axes[0]:0;
      window.__padSteer=Math.abs(ax)>.14?ax:0;
      const btn=i=>p.buttons&&p.buttons[i]?(p.buttons[i].value??(p.buttons[i].pressed?1:0)):0;
      K.KeyW=btn(7)>.12 || !!(K.KeyW&&!(p.buttons&&p.buttons[7]));
      K.KeyS=btn(6)>.12;
      if(btn(0)>.6)K.Space=1;
      else if(p.buttons)K.Space=0;
    }
    cb(t);
  });

  // Keep AI traffic and the player non-colliding when ghost mode is enabled.
  // AI cars still use their existing lane/traffic-light behavior.
  const r1=window.requestAnimationFrame;
  // Patch the solid-traffic hooks directly through their shared state.
  // The pre-hook no longer brakes for the player in ghost mode; post-hook skips player hits.
  const solidScript=[...document.scripts].find(x=>(x.textContent||'').includes('function pre(){ai.forEach'));
  if(solidScript){
    solidScript.textContent=solidScript.textContent
      .replace('test(car.x,car.z);','if(!SV.ghostTraffic)test(car.x,car.z);')
      .replace('function post(){const now=performance.now(),dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;if(picking)return;',
               'function post(){const now=performance.now(),dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;if(picking||SV.ghostTraffic)return;');
  }

  // Reuse building geometries instead of disposing/recreating them as city blocks scroll.
  const geoCache=new Map();
  const originalSetBox=setBox;
  setBox=function(m,x0,z0,w,d,h,y,mat,ou){
    const key=[w,d,h,ou].map(v=>Math.round(v*100)/100).join('|');
    let g=geoCache.get(key);
    if(!g){g=boxGeo(w,h,d,ou);geoCache.set(key,g)}
    m.geometry=g;m.material=bmats[mat];m.position.set(x0+w/2,y+h/2,z0+d/2);m.visible=true;
  };

  // Cache POIs briefly and throttle only the small rotating minimap to 15 fps.
  const rawPois=pois;let poiCache=[],poiAt=0;
  pois=function(){
    const now=performance.now();
    if(now-poiAt>2000){poiCache=rawPois();poiAt=now}
    return poiCache;
  };
  const rawDraw=drawMap;let nextMini=0;
  drawMap=function(canvas){
    if(canvas&&canvas.id==='miniMap'){
      const now=performance.now();if(now<nextMini)return;nextMini=now+1000/15;
    }
    return rawDraw(canvas);
  };
})();
</script>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { Client } from "https://esm.sh/colyseus.js@0.16.22";
import { supabaseConfig, multiplayerUrl } from "./supabase-config.js";

const $ = (id) => document.getElementById(id);
const gate = document.createElement('div');

document.body.appendChild(online);
const css=document.createElement('style');
css.textContent=`
#accountGate{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#1b3158 0%,#080d19 55%,#03050a 100%);font-family:system-ui,sans-serif;color:#fff}
.authCard{width:min(92vw,460px);padding:34px 30px;border:1px solid #52658b;border-radius:22px;background:linear-gradient(145deg,#17243a,#0b1220);box-shadow:0 25px 90px #000b;text-align:center}.authMark{font-weight:1000;letter-spacing:5px;color:#ffd23f;font-size:13px}.authMark span{color:#fff}.authCard h1{font-size:30px;margin:18px 0 8px}.authCard p{color:#c3cee0;line-height:1.5}.googleBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;margin:24px 0 12px;border:0;border-radius:10px;background:#fff;color:#202124;font-weight:800;font-size:16px;cursor:pointer}.googleBtn span{font-weight:1000;font-size:20px;color:#4285f4}.googleBtn:disabled{opacity:.5;cursor:not-allowed}#authMessage{min-height:24px;color:#ffd66b;font-size:13px;margin:10px 0}.authCard small{color:#9eacc4}#onlineHud{position:fixed;z-index:20;top:calc(16px + env(safe-area-inset-top,0px));left:20px;font:700 12px system-ui;display:none}#onlineOpen{background:#0b1729dd;color:#9ef5c1;border:1px solid #3d8667;border-radius:9px;padding:8px 11px;cursor:pointer}#onlinePanel{display:none;margin-top:7px;padding:14px;min-width:220px;border:1px solid #40516f;border-radius:12px;background:#0b1220f2;box-shadow:0 8px 30px #0009}#onlinePanel button{display:block;width:100%;margin-top:8px;padding:8px;border:0;border-radius:7px;background:#253655;color:white;font-weight:700;cursor:pointer}#onlineDetails{font-size:12px;color:#c3cee0;margin-top:8px;line-height:1.5}.remoteName{position:fixed;z-index:19;pointer-events:none;transform:translate(-50%,-100%);padding:3px 7px;border-radius:5px;background:#07101dcc;border:1px solid #ffffff66;color:white;font:800 11px system-ui;text-shadow:0 1px 3px #000;white-space:nowrap}
`;
document.head.appendChild(css);
$('onlineOpen').onclick=()=>{$('onlinePanel').style.display=$('onlinePanel').style.display==='block'?'none':'block'};
$('onlineClose').onclick=()=>$('onlinePanel').style.display='none';

const configured = !!(supabaseConfig && supabaseConfig.url && supabaseConfig.anonKey && !String(supabaseConfig.url).includes('postgresql://postgres:[518Southforest!]@db.dvruerjqfhmsiugqahii.supabase.co:5432/postgres') && !String(supabaseConfig.anonKey).includes('sb_publishable_xbY5UVbawIMEQ-VyMyQsVQ_kZXYUAsQ'));
let supabase=null,currentUser=null,room=null,colyseusClient=null,cloudReady=false,saveTimer=null,saving=false,pendingSave=false,activatingUserId=null;
const remotes=new Map();
const msg=(text)=>{$('authMessage').textContent=text};
const status=(text)=>{$('onlineOpen').textContent=text;$('onlineDetails').textContent=text};
const game=()=>window.__tdn;
function showGate(text){gate.style.display='flex';if(text)msg(text);if(game()){$('pick').style.display='none';}}
function hideGate(){gate.style.display='none';}
function cleanProgress(){const g=game();const data=JSON.parse(JSON.stringify(g.SV));data.fame=g.xp;data.photos=[...g.photoSet];return data;}
async function signInWithGoogle() {
  if(!supabase) throw new Error('Supabase is not initialized.');
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if (error) throw error;
}

async function saveCloudNow(){
  if(!currentUser || !cloudReady || !supabase) return;
  if(saving){ pendingSave=true; return; }
  saving=true;
  try{
    const {error}=await supabase.from('player_saves').upsert(
      {
        user_id: currentUser.id,
        progress: cleanProgress(),
        updated_at: new Date().toISOString()
      },
      {onConflict:'user_id'}
    );
    if(error) throw error;
    status(`☁ CLOUD SAVED · ${room?.state?.players?.size||1}/8`);
  }catch(e){
    console.error(e);
    status('CLOUD SAVE ERROR · check Supabase table and RLS');
  }finally{
    saving=false;
    if(pendingSave){
      pendingSave=false;
      saveCloudNow();
    }
  }
}
window.__tdnCloudSave=()=>{if(!currentUser||!cloudReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveCloudNow,900)};
window.__tdnDeleteCloudSave=async()=>{if(currentUser&&supabase){const {error}=await supabase.from('player_saves').delete().eq('user_id',currentUser.id);if(error)throw error;}};
async function loadCloud(user){
  const {data,error}=await supabase.from('player_saves').select('progress').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  const g=game();
  if(data?.progress){const cloud=data.progress;Object.assign(g.SV,cloud);g.xp=Number(cloud.fame)||0;g.photoSet.clear();(cloud.photos||[]).forEach(i=>g.photoSet.add(i));}
  else {
    // One-time migration from an older browser save, if one exists on this Chromebook.
    try{const legacy=JSON.parse(localStorage.getItem('hl5')||'null');if(legacy&&typeof legacy==='object'){Object.assign(g.SV,legacy);g.xp=Number(legacy.fame)||0;g.photoSet.clear();(legacy.photos||[]).forEach(i=>g.photoSet.add(i));}}catch(e){console.warn('Legacy save migration skipped',e)}
    g.SV.fame=g.xp;
    const {error:insertError}=await supabase.from('player_saves').upsert({user_id:user.id,progress:cleanProgress(),updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(insertError)throw insertError;
    try{localStorage.removeItem('hl5')}catch(e){}
  }
  g.buildPlayer();cloudReady=true;
}
function paintForCar(){const g=game();const selected=g.COS.find(c=>c.id===g.SV.paint);return selected?selected.c:(g.CARS[g.SV.car]||g.CARS[6]).c;}
function addRemote(player,id){
  if(id===room.sessionId||remotes.has(id))return;
  const g=game(),carDef=g.CARS[Number(player.car)]||g.CARS[6];
  const initialPaint=Number(player.paint)||carDef.c;
  const model=g.makeCar(initialPaint,carDef.k);g.scene.add(model.g);
  const tag=document.createElement('div');tag.className='remoteName';tag.textContent=player.name||'Driver';document.body.appendChild(tag);
  const remote={model,tag,target:{x:player.x||0,z:player.z||0,a:player.a||0},player,car:Number(player.car),paint:initialPaint};remotes.set(id,remote);
  player.onChange(()=>{
    remote.target={x:player.x,z:player.z,a:player.a};tag.textContent=player.name||'Driver';
    const nextCar=Number(player.car),nextDef=g.CARS[nextCar]||g.CARS[6],nextPaint=Number(player.paint)||nextDef.c;
    if(nextCar!==remote.car||nextPaint!==remote.paint){g.scene.remove(remote.model.g);remote.model=g.makeCar(nextPaint,nextDef.k);g.scene.add(remote.model.g);remote.car=nextCar;remote.paint=nextPaint;}
  });
}
function removeRemote(player,id){const r=remotes.get(id);if(!r)return;game().scene.remove(r.model.g);r.tag.remove();remotes.delete(id)}
function updateRemoteVisuals(){
  const g=game();if(!g)return;
  for(const r of remotes.values()){
    const t=r.target,m=r.model.g;m.position.x+=(t.x-m.position.x)*.32;m.position.z+=(t.z-m.position.z)*.32;
    const da=Math.atan2(Math.sin(t.a-m.rotation.y),Math.cos(t.a-m.rotation.y));m.rotation.y+=da*.32;
    const v=new g.THREE.Vector3(m.position.x,2.8,m.position.z).project(g.camera);
    const visible=v.z>-1&&v.z<1&&Math.abs(v.x)<1.15&&Math.abs(v.y)<1.15;
    r.tag.style.display=visible?'block':'none';if(visible){r.tag.style.left=((v.x*.5+.5)*innerWidth)+'px';r.tag.style.top=((-v.y*.5+.5)*innerHeight)+'px'}
  }
}
async function connectPublicRoom(user){
  if(room)return;
  try{
    colyseusClient=new Client(multiplayerUrl);
    const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(!session?.access_token)throw new Error('Your Supabase session expired. Please sign in again.');
    room=await colyseusClient.joinOrCreate('tokyo_public',{accessToken:session.access_token,name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Driver',car:game().SV.car,paint:paintForCar()});
    room.state.players.onAdd(addRemote);room.state.players.onRemove(removeRemote);
    room.onLeave(()=>{room=null;for(const [id] of remotes)removeRemote(null,id);status('OFFLINE · RECONNECT TO JOIN');});
    room.onError((code,message)=>{console.error('Multiplayer room error',code,message);status('SESSION ERROR · '+message)});
    status(`● ONLINE · ${room.state.players.size}/8`);
    room.state.players.onAdd(()=>status(`● ONLINE · ${room.state.players.size}/8`));
    room.state.players.onRemove(()=>status(`● ONLINE · ${room.state.players.size}/8`));
    if(!window.__tdnSendLoop){window.__tdnSendLoop=setInterval(()=>{if(!room||!currentUser)return;const c=game().car;room.send('drive',{x:c.x,z:c.z,a:c.a,car:game().SV.car,paint:paintForCar()});updateRemoteVisuals();},50)}
  }catch(e){console.error(e);room=null;status('MULTIPLAYER UNAVAILABLE · TRY RECONNECT');}
}
async function activateUser(user){
  if(!user)return;if(currentUser?.id===user.id&&cloudReady)return;if(activatingUserId===user.id)return;activatingUserId=user.id;currentUser=user;showGate('Loading your cloud garage…');
  try{
    await loadCloud(user);
    await connectPublicRoom(user);
    hideGate();$('pick').style.display='none';game().picking=false;
    $('onlineHud').style.display='block';
    status(room?`● ONLINE · ${room.state.players.size}/8`:'MULTIPLAYER UNAVAILABLE · TRY RECONNECT');
    game().toast('☁ Welcome back, '+(user.user_metadata?.full_name||'Driver'));
  }catch(e){console.error(e);cloudReady=false;showGate('Could not load your cloud save. Check the Supabase table and its security policies, then retry.');}
  finally{if(activatingUserId===user.id)activatingUserId=null;}
}
$('googleLogin').onclick=async()=>{
  if(!configured){msg('Setup needed: add your Supabase URL and publishable/anon key to public/supabase-config.js first.');return;}
  $('googleLogin').disabled=true;msg('Opening Google sign-in…');
  try{const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(error)throw error;}
  catch(e){console.error(e);msg('Sign-in failed: '+(e.message||'Please check your Supabase Google provider settings.'));$('googleLogin').disabled=false;}
};
$('onlineReconnect').onclick=()=>{if(currentUser){room=null;connectPublicRoom(currentUser)}};
$('accountLogout').onclick=async()=>{if(room){room.leave();room=null}cloudReady=false;currentUser=null;await supabase.auth.signOut();$('onlineHud').style.display='none';showGate('Signed out. Sign in with Google to continue playing.');};
if(!configured){showGate('Setup needed: create a Supabase project and paste its URL and publishable key into public/supabase-config.js.');$('googleLogin').disabled=true;}
else{
  try{
    supabase=createClient(supabaseConfig.url,supabaseConfig.anonKey);
    supabase.auth.onAuthStateChange((event,session)=>{
      if(session?.user){queueMicrotask(()=>activateUser(session.user));}
      else if(event==='SIGNED_OUT'){currentUser=null;cloudReady=false;showGate('Google sign-in is required to play.');}
    });
    supabase.auth.getSession().then(({data:{session},error})=>{if(error)throw error;if(session?.user)activateUser(session.user);else showGate('Google sign-in is required to play.');}).catch(e=>{console.error(e);showGate('Supabase initialization failed. Check supabase-config.js and your project URL.');});
  }catch(e){console.error(e);showGate('Supabase initialization failed. Check supabase-config.js.');}
}
window.addEventListener('beforeunload',()=>{if(currentUser&&cloudReady)saveCloudNow()});
</script>
